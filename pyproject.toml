[project]
name = "tapeloop"
dynamic = ["version"]
description = "An agent runtime that records every step, so any run can be replayed, forked, and diffed."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "replay", "determinism", "tooling"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  # 2.0 is the real floor: `omit` and ChatCompletionToolUnionParam
  # do not exist before it, and both are used unconditionally.
  "openai>=2.0",
  "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# Exact token counts. Optional because it downloads encoding files on first use,
# which is awkward for a project that emphasises offline determinism -- and because
# for a model newer than its tables it falls back anyway. See ADR-0019.
tokens = ["tiktoken>=0.8"]

[project.scripts]
tapeloop = "tapeloop.cli:main"

[project.urls]
Homepage = "https://github.com/DarkAngel007-design/tapeloop"
Documentation = "https://DarkAngel007-design.github.io/tapeloop"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "pyright>=1.1.390",
]
docs = [
  "mkdocs-material>=9.5",
  # API reference generated from docstrings, so it cannot drift from the code.
  "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tapeloop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tapeloop"]

[tool.hatch.build.targets.sdist]
# Ship what a contributor needs to verify the package, and nothing else.
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ", "S"]
# DTZ + the custom rules below guard Contract 1 (determinism):
# no naive datetimes, no unseeded randomness reaching a prompt.
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"m0/*" = ["S603", "S607", "T201"]  # the M0 spike shells out and prints on purpose
"tests/*" = ["S"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "m0", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Registration decorators (@registry.tool, @pytest.fixture(autouse=True)) define
# functions that are never called by name. That is the pattern, not a mistake.
reportUnusedFunction = false
# src/ is strict. m0/ and tests/ opt down to basic with a file-level
# `# pyright: basic` pragma -- visible in the file rather than hidden in config.

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on sys.path so shared doubles import as `helpers`, not `tests.helpers`
pythonpath = ["tests"]
# `not live` by default: live tests need a Docker daemon or a paid API and must
# never run in CI by accident. Opt in with `pytest -m live`.
addopts = "-q --strict-markers -m 'not live'"
markers = [
  "live: needs a Docker daemon or a real model API; deselected by default",
]
